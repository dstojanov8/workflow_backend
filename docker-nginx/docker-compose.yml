services:
  # PHP service
  php:
    build:
      # if docker related files were in root directory
      # context: .
      # context: ./docker
      context: ./
      dockerfile: Dockerfile
    volumes:
      # if docker related files were in root directory
      # - .:/var/www/html
      - ../:/var/www/html
    env_file: ../.env
    networks:
      - app-network

  # MySQL Database service
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/mysql
      - ../db_ini.sql:/docker-entrypoint-initdb.d/db_ini.sql # Add this line
    networks:
      - app-network

  # Nginx service (or replace with Apache as needed)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # if docker related files were in root directory
      # - .:/var/www/html
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  # Uncomment this block if you want to use Apache instead of Nginx
  # apache:
  #   build:
  #     # if docker related files were in root directory
  #     # context: .
  #     # context: ./docker
  #      context: ./
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     # if docker related files were in root directory
  #     # - .:/var/www/html
  #     - ../:/var/www/html
  #     - ./apache/apache.conf:/etc/apache2/sites-available/000-default.conf
  #   depends_on:
  #     - php
  #   networks:
  #     - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
